name: Build Android APK

on:
  push:
    paths:
      - 'fluxer_android/**'
      - '.github/workflows/build-android.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fluxer_android

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: fluxer_android

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-android-apks
          path: fluxer_android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Prepare release assets
        id: apk
        run: |
          # Find universal APK (no ABI suffix)
          UNIVERSAL=$(find app/build/outputs/apk/release -name "*universal*.apk" -type f | head -1)
          if [ -z "$UNIVERSAL" ]; then
            # Fallback to any release APK
            UNIVERSAL=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          fi
          echo "apk_path=$UNIVERSAL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$UNIVERSAL")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create/update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android APK (latest)"
          body: |
            Automated build from `${{ github.ref_name }}` @ `${{ github.sha }}`

            Built with AGP 8.11.1, targeting SDK 36, minSdk 26.
            Signed with debug keystore — for development/testing only.
          files: ${{ steps.apk.outputs.apk_path }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
